name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The Go module lives in a subdirectory; default every run step to it.
# Jobs that need the repo root (gitleaks) override this.
defaults:
  run:
    working-directory: mcp/git-server

env:
  GO_VERSION: "1.26.6"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mcp/git-server/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          test -z "$out" || { echo "gofmt issues - run 'make fmt':"; echo "$out"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Keep in step with GOLANGCI_LINT_VERSION in mcp/git-server/Makefile.
          version: v2.12.2
          working-directory: mcp/git-server
      - name: golangci-lint (e2e tag)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: mcp/git-server
          args: --build-tags e2e

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov tokenless (OIDC) upload for this public repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mcp/git-server/go.sum
      - name: test with coverage
        run: |
          go test ./... -count=1 -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1
      - name: enforce coverage floor
        run: |
          floor=75.0
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${total}% (floor ${floor}%)"
          awk -v t="$total" -v f="$floor" 'BEGIN { exit (t+0 >= f+0) ? 0 : 1 }' || {
            echo "::error::coverage ${total}% is below the ${floor}% floor"; exit 1; }
      - name: upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: mcp/git-server/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          # Never fail CI on an upload hiccup; the bash floor above is the gate.
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mcp/git-server/go.sum
      - name: cross-compile all platforms
        run: make build-all

  mcpb:
    runs-on: ubuntu-latest
    # The packer and checker run from the repo root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mcp/git-server/go.sum
      - name: pack bundles (host + windows)
        run: |
          make mcpb
          bash scripts/pack-mcpb.sh windows amd64
      - name: verify bundle structure
        run: python3 scripts/check-mcpb.py dist

  launcher:
    runs-on: ubuntu-latest
    # The launcher integrity test runs from the repo root; no Go toolchain needed.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: launcher SHA-256 integrity test
        run: make test-launcher

  install-codex:
    runs-on: ubuntu-latest
    # Pure-shell test against a fixture AGENTS.md; no Go toolchain or Codex binary needed.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install-codex.sh AGENTS.md drift-handling test
        run: make test-install-codex

  sast:
    runs-on: ubuntu-latest
    # security-events: write lets us publish gosec findings to the Security tab.
    # contents: read is still needed for checkout (job-level perms replace the
    # top-level default).
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mcp/git-server/go.sum
      - name: gosec
        # gosec writes the SARIF report, then exits non-zero if it found
        # anything - so the job stays a hard gate while the report is produced.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          "$(go env GOPATH)/bin/gosec" -fmt sarif -out results.sarif ./...
      - name: upload gosec SARIF to the Security tab
        # always(): publish the findings even when the gate above failed, so the
        # alerts show up in the Security tab rather than only in the run log.
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: mcp/git-server/results.sarif
          category: gosec

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mcp/git-server/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  gitleaks:
    runs-on: ubuntu-latest
    # Scan the whole repository from the root (the .gitleaks.toml lives there).
    # Use the gitleaks CLI directly (MIT, free) instead of gitleaks-action,
    # which requires a paid licence key for GitHub organisations.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the
      # upstream gitleaks_${GITLEAKS_VERSION}_checksums.txt release asset.
      # Bump in lockstep with GITLEAKS_VERSION.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        # Scans full git history; .gitleaks.toml allowlists the scanner's own
        # test fixtures. Exits non-zero on findings (default), failing the job.
        run: gitleaks git --config .gitleaks.toml --redact --verbose
