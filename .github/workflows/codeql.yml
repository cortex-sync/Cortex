name: CodeQL

on:
  push:
  pull_request:
  # Weekly scan so newly-published CodeQL queries run against unchanged code.
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publish findings to the Security tab
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: mcp/git-server/go.sum
      # Go only supports autobuild or manual extraction. We build manually so
      # CodeQL traces the compile of the module under mcp/git-server/ (autobuild
      # fumbles non-root modules).
      - name: initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go
          build-mode: manual
      - name: build (traced by CodeQL)
        working-directory: mcp/git-server
        run: go build ./...
      - name: analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:go"
