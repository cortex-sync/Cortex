name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Gate the release on a green end-to-end sync against real HTTPS Gitea.
  # Only needs read access (checkout + build/test); write is scoped to the
  # release job below, which is the only one that publishes anything.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: mcp/git-server/go.sum
      - name: e2e (Gitea over HTTPS)
        run: make e2e

  # Re-runs CI's essential gates (lint/vet/build/test/coverage, gosec,
  # govulncheck, gitleaks) against the tagged commit, and checks all three
  # version-bearing files agree with the tag - the CI workflow itself runs on
  # every push (including tags), but as a separate workflow it was never wired
  # as a release gate; a red CI run or a version mismatch could still ship.
  # Runs first (nothing else needs it to start) so a mismatch or a failing
  # gate is caught before goreleaser builds or publishes anything.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: version files agree with the tag
        run: |
          tag="${GITHUB_REF_NAME}"
          tag_no_v="${tag#v}"
          bin_version="$(cat bin/VERSION)"
          plugin_version="$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")"
          mcpb_version="$(python3 -c "import json; print(json.load(open('mcpb/manifest.json'))['version'])")"
          fail=0
          [ "$bin_version" = "$tag" ] || {
            echo "::error::bin/VERSION ($bin_version) does not match tag ($tag)"; fail=1; }
          [ "$plugin_version" = "$tag_no_v" ] || {
            echo "::error::.claude-plugin/plugin.json version ($plugin_version) does not match tag ($tag_no_v)"; fail=1; }
          [ "$mcpb_version" = "$tag_no_v" ] || {
            echo "::error::mcpb/manifest.json version ($mcpb_version) does not match tag ($tag_no_v)"; fail=1; }
          exit "$fail"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: mcp/git-server/go.sum
      - name: gofmt
        working-directory: mcp/git-server
        run: |
          out=$(gofmt -l .)
          test -z "$out" || { echo "gofmt issues - run 'make fmt':"; echo "$out"; exit 1; }
      - name: go vet
        working-directory: mcp/git-server
        run: go vet ./...
      - name: golangci-lint
        working-directory: mcp/git-server
        run: make lint
      - name: cross-compile all platforms
        working-directory: mcp/git-server
        run: make build-all
      - name: test with coverage
        working-directory: mcp/git-server
        run: |
          go test ./... -count=1 -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1
      - name: enforce coverage floor
        working-directory: mcp/git-server
        run: |
          floor=75.0
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${total}% (floor ${floor}%)"
          awk -v t="$total" -v f="$floor" 'BEGIN { exit (t+0 >= f+0) ? 0 : 1 }' || {
            echo "::error::coverage ${total}% is below the ${floor}% floor"; exit 1; }
      - name: gosec
        working-directory: mcp/git-server
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          "$(go env GOPATH)/bin/gosec" ./...
      - name: govulncheck
        working-directory: mcp/git-server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the
          # upstream gitleaks_${GITLEAKS_VERSION}_checksums.txt release asset.
          # Bump in lockstep with GITLEAKS_VERSION (keep in step with ci.yml).
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: run gitleaks
        run: gitleaks git --config .gitleaks.toml --redact --verbose

  release:
    needs: [e2e, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # goreleaser creates the GitHub release and uploads assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs full history + tags for the changelog
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: mcp/git-server/go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build release binaries with the patched stdlib regardless of the Go
          # the runner ships, matching the version CI validates against.
          GOTOOLCHAIN: go1.26.5

      # Pack the Claude Desktop / Cowork .mcpb bundles (one per target) and
      # attach them to the draft release goreleaser just created (version
      # consistency was already gated in `verify`, above).
      - name: Build and attach .mcpb desktop-extension bundles
        run: |
          make mcpb-all
          gh release upload "$GITHUB_REF_NAME" dist/*.mcpb --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOTOOLCHAIN: go1.26.5

      # goreleaser creates the release as a draft (.goreleaser.yaml
      # release.draft: true); only make it public here, once every asset -
      # including the .mcpb bundles above - has been attached successfully.
      # Anything failing before this point now leaves a non-public draft
      # instead of a live, partial release.
      - name: publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
